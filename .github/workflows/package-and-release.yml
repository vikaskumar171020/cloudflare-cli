name: Package and Release (DMG & Packages)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Auto-bump version type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
          - none
      custom_tag:
        description: 'Custom tag/version (e.g. v0.2.0). Overrides bump_type if provided.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Automated Versioning & Git Tagging
  # ----------------------------------------------------------------------------
  version:
    name: Auto-Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.bump.outputs.release_tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump Version & Sync Git
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
            BUMP_TYPE="${{ github.event.inputs.bump_type }}"

            if [ -n "$CUSTOM_TAG" ]; then
              # Strip leading 'v' if present for npm version
              CLEAN_VER="${CUSTOM_TAG#v}"
              npm version "$CLEAN_VER" --no-git-tag-version --allow-same-version
              NEW_TAG="v${CLEAN_VER}"
            elif [ "$BUMP_TYPE" != "none" ]; then
              npm version "$BUMP_TYPE" --no-git-tag-version
              PKG_VER=$(node -p "require('./package.json').version")
              NEW_TAG="v${PKG_VER}"
            else
              PKG_VER=$(node -p "require('./package.json').version")
              NEW_TAG="v${PKG_VER}"
            fi

            # Commit updated package.json & package-lock.json back to main branch
            if ! git diff --quiet package.json; then
              git add package.json package-lock.json
              git commit -m "chore(release): bump version to ${NEW_TAG} [skip ci]"
              git push origin HEAD:${{ github.ref_name || 'main' }}
            fi

            # Create Git tag if not present
            if ! git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
              git tag -a "${NEW_TAG}" -m "Release ${NEW_TAG} (auto-bumped)"
              git push origin "${NEW_TAG}"
            fi
          else
            # Triggered via push of a tag (e.g. v0.2.0)
            NEW_TAG="${GITHUB_REF_NAME}"
            CLEAN_VER="${NEW_TAG#v}"
            
            # Sync package.json if it doesn't match tag
            PKG_VER=$(node -p "require('./package.json').version")
            if [ "$PKG_VER" != "$CLEAN_VER" ]; then
              npm version "$CLEAN_VER" --no-git-tag-version
              git add package.json package-lock.json
              git commit -m "chore(release): sync package version to ${NEW_TAG} [skip ci]"
              git push origin HEAD:main || true
            fi
          fi

          echo "release_tag=${NEW_TAG}" >> $GITHUB_OUTPUT
          echo "version=${NEW_TAG#v}" >> $GITHUB_OUTPUT
          echo "Target Release Tag: ${NEW_TAG}"

  # ----------------------------------------------------------------------------
  # Job 2: Lint & Automated Tests
  # ----------------------------------------------------------------------------
  test:
    name: Lint & Unit Tests
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Run Test Suite (Offline Mock Mode)
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 3: Build macOS DMG and Standalone Packages
  # ----------------------------------------------------------------------------
  package-macos:
    name: Build DMG & Dist Packages
    needs: [version, test]
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Standalone Packages and macOS DMG
        run: ./scripts/package.sh

      - name: Upload Build Artifacts (Visible in GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-cli-dist-packages
          path: |
            build_artifacts/*.dmg
            build_artifacts/*.tgz
            build_artifacts/*.tar.gz
          retention-days: 14

  # ----------------------------------------------------------------------------
  # Job 4: Publish GitHub Release & Packages
  # ----------------------------------------------------------------------------
  release:
    name: Publish Release to GitHub
    needs: [version, package-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.release_tag }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: cloudflare-cli-dist-packages
          path: release_assets

      - name: Publish GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: Cloudflare CLI ${{ needs.version.outputs.release_tag }}
          files: |
            release_assets/*.dmg
            release_assets/*.tgz
            release_assets/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (npm registry)
        run: |
          TGZ_FILE=$(ls release_assets/*.tgz | head -n 1)
          if [ -f "$TGZ_FILE" ]; then
            echo "Publishing $TGZ_FILE to GitHub Packages..."
            npm publish "$TGZ_FILE" --registry=https://npm.pkg.github.com || echo "Note: Package publish to GitHub Packages skipped if version already exists."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Public NPM Registry (npmjs.com)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          TGZ_FILE=$(ls release_assets/*.tgz | head -n 1)
          if [ -f "$TGZ_FILE" ]; then
            echo "Publishing $TGZ_FILE to npmjs.com..."
            npm publish "$TGZ_FILE" --access public --registry=https://registry.npmjs.org/ || echo "Note: Package publish to npmjs.com skipped if version already exists."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image to GitHub Packages (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.release_tag }}
            ghcr.io/${{ github.repository }}:latest

      - name: Summary
        run: |
          echo "## 🚀 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Your release is now live across all distribution channels:" >> $GITHUB_STEP_SUMMARY
          echo "- **Auto-Bumped Tag**: \`${{ needs.version.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Public NPM**: [\`@${{ github.repository_owner }}/cloudflare-cli\`](https://www.npmjs.com/package/@${{ github.repository_owner }}/cloudflare-cli)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases**: [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "- **macOS DMG Installer**: \`cloudflare-cli-${{ needs.version.outputs.release_tag }}-macos.dmg\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Standalone Package**: \`cloudflare-cli-${{ needs.version.outputs.release_tag }}-package.tar.gz\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Packages (NPM)**: \`@${{ github.repository_owner }}/cloudflare-cli\`" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Packages (Docker GHCR)**: \`ghcr.io/${{ github.repository }}:${{ needs.version.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
