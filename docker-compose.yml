services:
  # Test Runner Service: Runs vitest test suite inside isolated container with offline mock mode
  test:
    build:
      context: .
      target: test
    command: npm test
    environment:
      - NODE_ENV=test
      - CLOUDFLARE_LOCAL_MODE=true

  # Test & Lint Combined Service
  test-all:
    build:
      context: .
      target: test
    command: sh -c "npm run lint && npm test"
    environment:
      - NODE_ENV=test
      - CLOUDFLARE_LOCAL_MODE=true

  # Interactive Dev Container: Mounts host files for live development
  dev:
    build:
      context: .
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev -- --help
    environment:
      - CLOUDFLARE_LOCAL_MODE=true
    env_file:
      - path: .env
        required: false

  # CLI Executable Service: Runs built containerized CLI commands
  cli:
    build:
      context: .
      target: runner
    env_file:
      - path: .env
        required: false
